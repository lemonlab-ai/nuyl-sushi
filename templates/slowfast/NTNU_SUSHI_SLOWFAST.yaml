# Template for facebookresearch/SlowFast
# Update dataset paths and class count before use.

TRAIN:
  ENABLE: True
  DATASET: kinetics
  BATCH_SIZE: 8
  EVAL_PERIOD: 1
  CHECKPOINT_PERIOD: 1
  AUTO_RESUME: True

TEST:
  ENABLE: True
  DATASET: kinetics
  BATCH_SIZE: 8

DATA:
  NUM_FRAMES: 32
  SAMPLING_RATE: 2
  TRAIN_JITTER_SCALES: [256, 320]
  TRAIN_CROP_SIZE: 224
  TEST_CROP_SIZE: 256
  INPUT_CHANNEL_NUM: [3, 3]
  PATH_TO_DATA_DIR: /ABS/PATH/TO/TASK_A_DATA
  PATH_PREFIX: /ABS/PATH/TO/TASK_A_DATA

MODEL:
  NUM_CLASSES: 32
  ARCH: slowfast
  MODEL_NAME: SlowFast
  LOSS_FUNC: cross_entropy
  DROPOUT_RATE: 0.5

SLOWFAST:
  ALPHA: 4
  BETA_INV: 8
  FUSION_CONV_CHANNEL_RATIO: 2
  FUSION_KERNEL_SZ: 5

RESNET:
  DEPTH: 50
  NUM_GROUPS: 1
  WIDTH_PER_GROUP: 64

SOLVER:
  BASE_LR: 0.01
  LR_POLICY: cosine
  MAX_EPOCH: 30
  MOMENTUM: 0.9
  WEIGHT_DECAY: 1e-4
  WARMUP_EPOCHS: 3.0

NUM_GPUS: 1
NUM_SHARDS: 1
RNG_SEED: 42
OUTPUT_DIR: /ABS/PATH/TO/OUTPUT/SLOWFAST
