# Template for actionformer_release.
# Update all paths before training.

dataset_name: anet
train_split: [training]
val_split: [validation]
dataset:
  json_file: /ABS/PATH/TO/ntnu-sushi/artifacts/task_b/activitynet_fine.json
  feat_stride: 16
  num_frames: 16
  default_fps: 30
  downsample_rate: 1
  max_seq_len: 2304
  trunc_thresh: 0.5
  crop_ratio: null
  input_dim: 2304
  num_classes: 32
  feat_folder: /ABS/PATH/TO/FEATURES
  file_prefix: null
  file_ext: .npy
  force_upsampling: false

model_name: LocPointTransformer
model:
  fpn_type: identity
  backbone_type: convTransformer
  backbone_arch: [2, 2, 5]
  n_head: 4
  n_mha_win_size: -1
  embd_kernel_size: 3
  embd_dim: 512
  embd_with_ln: true
  fpn_dim: 512
  head_dim: 512
  regression_range: [[0, 4], [4, 8], [8, 16], [16, 32], [32, 10000]]
  max_buffer_len_factor: 6.0
  use_abs_pe: false
  use_rel_pe: false

opt:
  learning_rate: 0.001
  epochs: 20
  weight_decay: 0.05
  warmup_epochs: 5

loader:
  batch_size: 4
  num_workers: 4

train_cfg:
  center_sample: radius
  center_sample_radius: 1.5
  loss_weight: 1.0
  cls_prior_prob: 0.01
  init_loss_norm: 2000
  clip_grad_l2norm: 1.0
  head_empty_cls: []
  dropout: 0.0
  droppath: 0.1
  label_smoothing: 0.0

test_cfg:
  pre_nms_thresh: 0.001
  pre_nms_topk: 5000
  iou_threshold: 0.1
  min_score: 0.001
  max_seg_num: 2000
  nms_method: soft
  duration_thresh: 0.05
  multiclass_nms: true
  nms_sigma: 0.5
  voting_thresh: 0.95
